<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesion</title>
</head>
<body>
        <h1> Iniciar sesion</h1>
    <form action="/signin" method="POST">
        <div>
        <label for="email">Email:</label>
        <input
            type="text"
            id="email"
            nombre="email"
        required>
        </div>
        <div>
        <label for="password">Contraseña:</label>
        <input
            type="password"
            id="password"
            nombre="password"
        required>
        </div>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
